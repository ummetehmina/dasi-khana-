<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasi Khana - Authentic Homemade Recipes</title>
  <style>
    :root {
      --primary: #e67e22;
      --dark: #2c3e50;
      --light: #f9f9f9;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: var(--dark);
      color: white;
      padding: 1.5rem 2rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary);
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      margin-top: 5px;
    }

    nav {
      background-color: #34495e;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: var(--primary);
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.8rem;
      color: var(--dark);
      margin-bottom: 20px;
      border-bottom: 3px solid var(--primary);
      display: inline-block;
      padding-bottom: 5px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .recipe-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid #eaeaea;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .recipe-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .recipe-card h3 {
      font-size: 1.3rem;
      color: var(--dark);
      text-transform: capitalize;
      margin-bottom: 12px;
    }

    .recipe-card p {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #d35400;
    }

    footer {
      background-color: var(--dark);
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍲 Dasi Khana</h1>
    <p>Daily Homemade Fresh Recipes & Cooking Ideas</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="#recipes">Recipes</a>
    <a href="#about">About</a>
  </nav>

  <div class="container">
    
    <h2 class="section-title" id="recipes">Latest Recipes</h2>
    
    <!-- Dynamic recipes generated by n8n will load here -->
    <div class="recipe-grid" id="latest-recipes-container">
      <div style="text-align: center; width: 100%; grid-column: 1 / -1; color: #888; padding: 20px;">
        Checking for latest recipes...
      </div>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Dasi Khana. All Rights Reserved.</p>
  </footer>

  <!-- Automatic GitHub Recipe Fetcher Script -->
  <script>
    async function loadLatestRecipes() {
      try {
        const owner = 'ummetehmina';
        const repo = 'dasi-khana-';
        
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
        const files = await response.json();
        
        // Filter out recipe files (recipe-YYYY-MM-DD.html)
        const recipeFiles = files.filter(file => file.name.startsWith('recipe-') && file.name.endsWith('.html'));
        
        // Sort newest first
        recipeFiles.sort((a, b) => b.name.localeCompare(a.name));
        
        const container = document.getElementById('latest-recipes-container');
        
        if (container) {
          container.innerHTML = ''; // Clear loading placeholder
          
          if (recipeFiles.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1;">Abhi koi recipe uploaded nahi hai.</p>';
            return;
          }

          recipeFiles.forEach(file => {
            const cleanTitle = file.name
              .replace('.html', '')
              .replace('recipe-', '')
              .replaceAll('-', ' ');
            
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
              <div>
                <h3>🍲 ${cleanTitle}</h3>
                <p>Nayi desi recipe post, detail parhne ke liye niche click karein.</p>
              </div>
              <a href="${file.name}" class="btn">View Full Recipe →</a>
            `;
            
            container.appendChild(card);
          });
        }
      } catch (error) {
        console.error("Error loading recipes:", error);
      }
    }

    window.addEventListener('DOMContentLoaded', loadLatestRecipes);
  </script>

</body>
</html>
